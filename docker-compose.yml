services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    tty: true
    # No user: override here: the image's own entrypoint runs as root on a
    # fresh start to initialize and chown the data directory, then drops
    # privileges itself. Overriding it (previously "995:994") skipped that
    # init step, so a bind-mounted /var/lib/mysql (created root-owned by
    # Docker on a fresh host) was never writable by mariadbd (#15).
    # The mPCC reaches the database as db:3306 over the compose network, so
    # the port isn't published.  For local access from the host only, use:
    #ports:
    #  - 127.0.0.1:3306:3306
    volumes:
      - db-data:/var/lib/mysql
      - /etc/mysql/conf.d/:/etc/mysql/conf.d
    env_file:
      - .env
    environment:
      # refuse to start with an unset or empty password (#6)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

  mpcc:
    # Pinned to a release, the same major.minor as the job server below: the
    # mPCC refuses a job server on another major.minor (426).  Upgrade both
    # together; see "Image versions" in the README.
    image: ghcr.io/mprov-ng/mprov-control-center:v0.7.4
    #image: localhost/mprov-control-center:dev
    restart: unless-stopped
    pull_policy: always
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 10s
      retries: 8
      # the first start migrates and loads a new database before Apache is up
      # (~95 s on a small VM); failed checks don't count until this is over.
      start_period: 300s
    depends_on:
      db:
        condition: service_started
    volumes: 
      # for dev only, Documentation Pending.
      #  General steps:
      #    - start the stack with this commented out.
      #    - run `docker cp mprov-compose-mpcc-1:/var/www/mprov_control_center /root/mprov_control_center`
      #    - once all the jobserver jobs complete, down the stack
      #    - uncomment this line.
      #    - PROFIT!
      #- /root/mprov_control_center:/var/www/mprov_control_center
      #
      # Change this to a bind mount if you want to see it outside the container and remove
      # the volume at the end of the file.
      - mpcc-media:/var/www/mprov_control_center/media
      - mprov-conf:/etc/mprov/
      # mprov_backup's output directory (mprov-ng/mprov_control_center#457).
      # Its own named volume, not a bind mount of the host's /var/lib/mprov:
      # the job server bind-mounts that whole host directory for its own
      # unrelated data, so the two would collide.
      - mpcc-backups:/var/lib/mprov/backups
      # The mPCC's own CA and HTTPS certificate, made at first start
      # (mprov-ng/mprov_control_center#381).  A named volume so they survive
      # the container being recreated: a new CA would invalidate everything
      # it signed.
      - mpcc-tls:/var/lib/mprov/tls
    env_file:
     - .env
    environment:
      DB_PASS: ${DB_PASS:?set DB_PASS in .env (the same value as MYSQL_PASSWORD)}
    ports:
     - 80:80
     - 443:443
    hostname: ${MPROV_MPCC_HOSTNAME}
    command: sh -c '/wait-for-it.sh -t 0 db:3306 -- /var/www/mprov_control_center/install_scripts/init_mpcc.sh -d'
    
  jobserver:
    # Pinned to a release that matches the mPCC's major.minor (see above).
    image: ghcr.io/mprov-ng/mprov-jobserver:v0.7.1
    # image: localhost/mprov-jobserver:dev
    restart: unless-stopped
    pull_policy: always
    depends_on:
      mpcc:
        condition: service_healthy
    network_mode: host
    tty: true
    volumes:
      - mprov-conf:/etc/mprov/
      - /export:/export
      - /etc/genders:/etc/genders
      - /var/lib/mprov:/var/lib/mprov
      # The job server's own key and certificate, from enrolling with the mPCC
      # (job server 0.7.0 and later, mprov-ng/mprov_control_center#381).  A
      # named volume over that path, so the key isn't in the host's
      # /var/lib/mprov with the job server's other data.  Never mount mpcc-tls
      # here: it holds the mPCC's CA key.
      - jobserver-tls:/var/lib/mprov/tls
    env_file:
      - .env
    user: ${UID:-0}:${GID:-0}
    # The job server needs a privileged container: building an image
    # bind-mounts /dev, /proc, /run and /sys into it, chroots into it, and
    # makes device nodes there; reading a disk-image base runs libguestfs,
    # which uses /dev/kvm; and its dnsmasq serves DHCP and TFTP on the
    # host's network.
    privileged: true
    hostname: ${MPROV_JOBSERVER_HOSTNAME}


volumes:
  mprov-conf:
  db-data:
  mpcc-media:
  mpcc-backups:
  mpcc-tls:
  jobserver-tls:

