services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    tty: true
    user: "995:994"
    # The mPCC reaches the database as db:3306 over the compose network, so
    # the port isn't published.  For local access from the host only, use:
    #ports:
    #  - 127.0.0.1:3306:3306
    volumes:
      - /var/lib/mysql:/var/lib/mysql
      - /etc/mysql/conf.d/:/etc/mysql/conf.d
    env_file:
      - .env
    environment:
      # refuse to start with an unset or empty password (#6)
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?set MYSQL_ROOT_PASSWORD in .env}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?set MYSQL_PASSWORD in .env}

  mpcc:
    image: ghcr.io/mprov-ng/mprov-control-center:dev
    #image: localhost/mprov-control-center:dev
    restart: unless-stopped
    pull_policy: always
    tty: true
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/"]
      interval: 10s
      timeout: 10s
      retries: 8
      # the first start migrates and loads a new database before Apache is up
      # (~95 s on a small VM); failed checks don't count until this is over.
      start_period: 300s
    depends_on:
      db:
        condition: service_started
    volumes: 
      # for dev only, Documentation Pending.
      #  General steps:
      #    - start the stack with this commented out.
      #    - run `docker cp mprov-compose-mpcc-1:/var/www/mprov_control_center /root/mprov_control_center`
      #    - once all the jobserver jobs complete, down the stack
      #    - uncomment this line.
      #    - PROFIT!
      #- /root/mprov_control_center:/var/www/mprov_control_center
      #
      # Change this to a bind mount if you want to see it outside the container and remove
      # the volume at the end of the file.
      - mpcc-media:/var/www/mprov_control_center/media
      - mprov-conf:/etc/mprov/
    env_file:
     - .env
    environment:
      DB_PASS: ${DB_PASS:?set DB_PASS in .env (the same value as MYSQL_PASSWORD)}
    ports:
     - 80:80
     - 443:443
    hostname: ${MPROV_MPCC_HOSTNAME}
    command: sh -c '/wait-for-it.sh -t 0 db:3306 -- /var/www/mprov_control_center/install_scripts/init_mpcc.sh -d'
    
  jobserver:
    image: ghcr.io/mprov-ng/mprov-jobserver:latest
    # image: localhost/mprov-jobserver:dev
    cgroup: host
    restart: unless-stopped
    pull_policy: always
    depends_on:
      mpcc:
        condition: service_healthy
        #systemd: true
    network_mode: host
    tty: true
    volumes:
      - mprov-conf:/etc/mprov/
      - /export:/export
      - /sys/fs/cgroup:/sys/fs/cgroup
      - /etc/genders:/etc/genders
      - /var/lib/mprov:/var/lib/mprov
    env_file:
      - .env
    user: ${UID:-0}:${GID:-0}
    privileged: true
    hostname: ${MPROV_JOBSERVER_HOSTNAME}
    # we wait for localhost here because we are host networking and all services are running from the same .
    command: sh -c '/wait-for-it.sh -t 0 localhost:80 -- /sbin/init'


volumes:
  mprov-conf:
  # db:
  mpcc-media:

